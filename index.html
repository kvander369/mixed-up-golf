<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
     numbers; without it the safe-area padding in the CSS is inert and controls
     end up under the iPhone home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8FD974">
<meta name="description" content="Round tracker for the inside game, junk, skins and the random draw. Works with no signal.">
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignores the manifest for these two, so they are declared separately -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mixed Up">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>*{-webkit-text-size-adjust:100%;}html,body{margin:0;padding:0;}</style>
<title>Mixed Up Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">

<style>
  :root{
    /* ground + rules, matched to the 4Score app this replaces */
    --ground:#0D0D0D;
    --row:#151515;
    --row-2:#1C1C1C;
    --line:#2C2C2C;
    --line-soft:#232323;

    --ink:#FFFFFF;
    --ink-2:#B4B4B4;
    --ink-3:#8E8E8E;

    /* the 4Score bar green, and black-on-green */
    --bar:#8FD974;
    --bar-ink:#0C1607;
    --bar-dim:#5E9B48;

    /* the two meaningful-number colors from the app */
    --live:#4CD137;
    --gold:#F5D547;

    --f-sans:"Barlow",system-ui,-apple-system,sans-serif;
    --f-cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
  }

  *{box-sizing:border-box;}

  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--f-sans);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  .stage{height:100dvh;background:var(--ground);}
  .device{height:100%;background:var(--ground);}
  .screen{height:100%;display:flex;flex-direction:column;background:var(--ground);overflow:hidden;position:relative;}
  .island,.statusbar,.homebar{display:none;}

  /* ---------- green app bar ---------- */
  .appbar{
    flex-shrink:0;
    background:var(--bar);
    color:var(--bar-ink);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;
    /* grow up behind the status bar so the clock never lands on the buttons */
    padding-top:env(safe-area-inset-top);
    height:calc(60px + env(safe-area-inset-top));
    background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(0,0,0,.10));
    box-shadow:0 3px 14px -4px rgba(0,0,0,.85);
    position:relative;z-index:2;
  }
  .brand{
    font-family:var(--f-cond);
    font-size:19px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    white-space:nowrap;line-height:1;
  }
  .brandwrap{display:flex;flex-direction:column;gap:2px;min-width:0;flex-shrink:0;}
  .brand2{
    font-family:var(--f-cond);
    font-size:19px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    line-height:1;
  }
  /* top of the app = set once, before the round */
  .setupbtns{display:flex;gap:6px;flex-shrink:0;}
  .setupbtn{
    font-family:var(--f-cond);
    font-size:14px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    padding:8px 11px;
    border:2px solid var(--bar-ink);
    border-radius:8px;
    background:transparent;color:var(--bar-ink);
    opacity:.6;cursor:pointer;
  }
  .setupbtn[aria-selected="true"]{background:var(--bar-ink);color:var(--bar);opacity:1;}

  .ninetoggle{display:flex;gap:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0;}
  .ninebtn{
    font-family:var(--f-cond);
    font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 13px;
    border:0;background:var(--row-2);color:var(--ink-3);
    opacity:.55;cursor:pointer;
    line-height:1.15;
    position:relative;
  }
  .ninebtn[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink);opacity:1;}
  /* a dot marks a nine that is already fully entered */
  .ninebtn.filled::after{
    content:"";position:absolute;top:4px;right:5px;
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
  }

  #errbar{
    display:none;
    background:#5A1414;color:#FFD9D9;
    padding:9px 14px;font-size:13px;line-height:1.4;
    border-bottom:1px solid #8A2222;
    word-break:break-word;
  }

  /* ---------- scroll body ---------- */
  .scrollarea{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .shell{display:flex;flex-direction:column;padding-bottom:calc(14px + env(safe-area-inset-bottom));}

  /* ---------- context row ---------- */
  .context{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding: 9px 16px;
    border-bottom:1px solid var(--line);
    background:var(--row);
  }
  .ctx-label{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ctx-name{
    font-size: 19px;font-weight:500;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ctx-sub{
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .ctx-nav{display:flex;gap:7px;flex-shrink:0;}
  .navbtn{
    width:40px;height:36px;
    border:1px solid var(--line);
    background:var(--row-2);
    color:var(--ink-2);
    border-radius:6px;
    font-size:17px;line-height:1;
    cursor:pointer;
  }
  .navbtn:disabled{opacity:.25;cursor:default;}

  .savechip{
    display:flex;align-items:center;gap:6px;
    font-family:var(--f-cond);
    font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--live);
    padding:7px 16px;
    border-bottom:1px solid var(--line-soft);
    background:var(--ground);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--live);}

  /* ---------- the scorecard grid ---------- */
  .card{padding:0 0 6px;}
  .cardhead{
    display:flex;align-items:baseline;justify-content:space-between;
    padding: 6px 16px 5px;
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .grid{padding:0 10px;}
  .row{display:grid;grid-template-columns:repeat(9,1fr) 1.3fr;gap:0;}
  .hnum{
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;
    text-align:center;color:var(--ink-3);
    padding:5px 0;
    border-right:1px solid var(--line-soft);
    font-variant-numeric:tabular-nums;
  }
  .hnum:last-child{border-right:0;color:var(--ink-2);letter-spacing:.07em;}
  .cell{
    font-family:var(--f-sans);
    font-size:21px;font-weight:500;
    font-variant-numeric:tabular-nums;
    height:52px;
    display:flex;align-items:center;justify-content:center;
    background:var(--row);
    border:1px solid var(--line-soft);
    border-right-width:0;
    color:var(--ink);
    cursor:pointer;
    padding:0;
  }
  .cell:last-of-type{border-right-width:1px;}
  .cell.empty{color:#4E4E4E;}
  .cell.next{background:var(--row-2);box-shadow:inset 0 -3px 0 var(--bar);}
  .cell.armed{background:#2A2612;color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);}

  .cell{transition:background .12s ease, color .12s ease, box-shadow .12s ease;}
  @keyframes land{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .cell.landed{animation:land .17s cubic-bezier(.2,1.5,.4,1);}
  @keyframes pop{0%{transform:scale(1);}42%{transform:scale(1.14);}100%{transform:scale(1);}}
  .total.pop{animation:pop .34s cubic-bezier(.2,1.4,.4,1);}
  .grid{position:relative;padding-bottom:2px;}
  .grid::after{
    content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;
    background:var(--bar);transform:scaleX(0);transform-origin:left;
    transition:transform .36s cubic-bezier(.4,0,.2,1);
  }
  .grid.complete::after{transform:scaleX(1);}
  .total{
    font-family:var(--f-sans);
    font-size:21px;font-weight:700;
    font-variant-numeric:tabular-nums;
    height:52px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line-soft);
    background:var(--row-2);
    color:var(--ink-3);
  }
  .total.done{background:#0F2409;border-color:var(--bar-dim);color:var(--live);}

  .hint{
    padding: 8px 16px 0;
    font-size:14px;color:var(--ink-3);line-height:1.5;
  }
  .hint b{color:var(--ink-2);font-weight:500;}
  .savedot{
    font-style:normal;color:var(--live);
    font-size:12px;letter-spacing:.1em;
    margin-left:6px;
  }
  .savedot::before{content:"• ";}

  /* ---------- the "next chunk" action, shown once a nine is complete ---------- */
  .nextwrap{padding:12px 12px 0;}
  .nextbtn{
    width:100%;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 16px;
    border:0;border-radius:9px;
    background:var(--bar);
    background-image:linear-gradient(180deg,rgba(255,255,255,.20),rgba(0,0,0,.08));
    color:var(--bar-ink);
    font-family:var(--f-cond);
    font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 4px 16px -6px rgba(143,217,116,.7);
  }
  .nextbtn .tot{
    font-family:var(--f-sans);
    font-size:15px;font-weight:600;letter-spacing:.02em;text-transform:none;
    opacity:.66;
  }
  .donechip{
    text-align:center;padding:11px 12px;
    font-family:var(--f-cond);
    font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--live);
  }
  .donechip::before{content:"✓  ";}
  @keyframes rise{from{transform:translateY(7px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .nextbtn{animation:rise .2s ease;}

  /* ---------- sub-tabs inside Course Info ---------- */
  .subtabs{
    display:none;
    grid-template-columns:1fr 1fr;gap:0;
    background:var(--ground);
    border-bottom:1px solid var(--line);
  }
  .subtabs.on{display:grid;}
  .subtab{
    border:0;background:transparent;cursor:pointer;
    font-family:var(--f-cond);
    font-size:16px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);
    padding:11px 6px 9px;
    border-bottom:3px solid transparent;
  }
  .subtab[aria-selected="true"]{color:var(--bar);border-bottom-color:var(--bar);}

  /* ---------- players ---------- */
  .players{display:none;}
  .players.on{display:block;}
  .pteam{
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);
    padding:12px 16px 6px;
  }
  .prow{
    display:grid;grid-template-columns:26px 1fr 84px;align-items:center;gap:10px;
    padding: 6px 16px;
    background:var(--row);
    border-top:1px solid var(--line-soft);
  }
  .pslot{
    font-family:var(--f-sans);
    font-size:16px;font-weight:700;color:var(--ink-3);text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .pin{
    font-family:var(--f-sans);
    font-size:18px;font-weight:500;
    background:var(--ground);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--ink);
    padding:9px 12px;
    width:100%;
    min-width:0;
  }
  .pin::placeholder{color:#5A5A5A;}
  .pin.hcp{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;}
  .pin:focus{border-color:var(--bar);outline:none;}
  .phead{
    display:grid;grid-template-columns:26px 1fr 84px;gap:10px;
    padding:0 16px 6px;
    font-family:var(--f-cond);
    font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .phead span:last-child{text-align:center;}

  /* ---------- holes: the whole card, review only ---------- */
  .holes{display:none;}
  .holes.on{display:block;}
  .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .hplain{overflow:visible;}
  /* the fixed-width grid needs no sticky anything */
  table.hgrid.big th{position:static;}
  table.hgrid.big .hcol{position:static;}
  table.hgrid{border-collapse:collapse;width:100%;min-width:100%;}
  table.hgrid th,table.hgrid td{
    font-variant-numeric:tabular-nums;
    text-align:center;
    padding:9px 4px;
    border-bottom:1px solid var(--line-soft);
    border-right:1px solid var(--line-soft);
    white-space:nowrap;
  }
  table.hgrid th{
    font-family:var(--f-cond);
    font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-2);
    background:var(--row-2);
    position:sticky;top:0;z-index:2;
  }
  table.hgrid td{font-size:18px;font-weight:500;color:var(--ink);background:var(--ground);}
  table.hgrid .hcol{
    position:sticky;left:0;z-index:1;
    background:var(--row);
    font-family:var(--f-cond);
    font-size:15px;font-weight:700;
    color:var(--ink-2);
    min-width:52px;
  }
  table.hgrid th.hcol{z-index:3;background:var(--row-2);}
  table.hgrid tr.sub td,table.hgrid tr.sub .hcol{
    background:var(--row-2);
    font-weight:700;color:var(--live);
    font-family:var(--f-cond);font-size:16px;letter-spacing:.05em;
  }
  table.hgrid td.par{color:var(--ink-3);font-size:15px;}
  table.hgrid tr.parrow td,table.hgrid tr.parrow .hcol{background:var(--row);}
  table.hgrid td.miss{color:#4E4E4E;}
  table.hgrid td.si{color:var(--ink-3);font-size:14px;}
  /* the two sides, exactly as 4Score shows them */
  table.hgrid td.won12{color:var(--live);font-weight:700;}
  table.hgrid td.won34{color:var(--gold);font-weight:700;}
  table.hgrid td.pt{
    font-family:var(--f-cond);
    font-size:14px;font-weight:700;letter-spacing:.06em;
    color:var(--ink-3);
    min-width:44px;
  }
  table.hgrid td.pt.won12{color:var(--live);}
  table.hgrid td.pt.won34{color:var(--gold);}

  /* running standing */
  .standing{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    padding:14px 16px;background:var(--row);
    border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  }
  .sideBox{
    display:flex;flex-direction:column;gap:2px;
    font-size:14px;color:var(--ink-2);line-height:1.25;
  }
  .sideBox span{
    font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
  }
  .sideBox.s12 span{color:var(--live);}
  .sideBox.s34{text-align:right;}
  .sideBox.s34 span{color:var(--gold);}
  .halved{
    text-align:center;font-size:13px;color:var(--ink-3);
    font-family:var(--f-cond);letter-spacing:.1em;text-transform:uppercase;
    display:flex;flex-direction:column;gap:1px;
  }
  .halved span{font-size:20px;font-weight:700;color:var(--ink-2);font-family:var(--f-sans);letter-spacing:0;}

  .popchips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:4px 16px 10px;}
  .popchip{
    background:var(--row);border:1px solid var(--line-soft);border-radius:8px;
    padding:9px 4px;text-align:center;
    font-size:13px;color:var(--ink-3);line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .popchip span{display:block;font-size:24px;font-weight:700;color:var(--bar);font-variant-numeric:tabular-nums;}
  table.hgrid td.zero{color:#4A4A4A;}
  table.hgrid td.one{color:var(--ink);}
  table.hgrid td.two{color:var(--bar);font-weight:700;}

  table.hgrid tr.taprow{cursor:pointer;}
  table.hgrid tr.taprow:active td{background:var(--row-2);}

  /* ---------- holes: stripped to the grid ----------
     Fixed column widths so rows never change width as scores land. */
  /* ---------- holes grid: CSS Grid, not a table ----------
     Every row uses the identical column template, so columns line up and row
     widths are fixed by construction. Table cells could split and drift; grid
     cells cannot. */
  .hx{display:flex;flex-direction:column;}
  .hxrow{
    display:grid;
    grid-template-columns:64px repeat(4,1fr);
    border-bottom:1px solid var(--line-soft);
  }
  .hxc{
    min-width:0;
    display:flex;align-items:center;justify-content:center;
    border-right:1px solid var(--line-soft);
    padding:0 2px;
    overflow:hidden;
  }
  .hxc:last-child{border-right:0;}

  .hxhead{background:var(--row-2);border-bottom:1px solid var(--line);}
  .hxhead .hxc{
    height:38px;
    font-family:var(--f-cond);
    font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-2);
    white-space:nowrap;
  }
  /* the (n) beside each name is that player's pops off the low man —
     the number the hole result is decided on */
  .hxhead .hxc i{
    font-style:normal;font-family:var(--f-sans);
    font-size:12px;font-weight:700;letter-spacing:0;
    margin-left:3px;
  }
  .hxhead .hxc.s12 i{color:var(--live);}
  .hxhead .hxc.s34 i{color:var(--gold);}
  /* a hairline under each name shows which side that column belongs to */
  .hxhead .hxc.s12{box-shadow:inset 0 -3px 0 rgba(76,209,55,.55);}
  .hxhead .hxc.s34{box-shadow:inset 0 -3px 0 rgba(245,213,71,.55);}

  .hxrow .hnum{
    flex-direction:column;justify-content:center;gap:0;
    background:var(--row);
    line-height:1.05;
  }
  .hxrow .hnum b{font-size:19px;font-weight:700;color:var(--ink-2);}
  .hxrow .hnum i{
    font-style:normal;font-family:var(--f-cond);
    font-size:12px;font-weight:600;color:#6E6E6E;white-space:nowrap;
  }

  .hxrow .sc{
    height:46px;
    font-size:23px;font-weight:500;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    position:relative;
  }
  .hxrow .sc.miss{color:#4E4E4E;}
  .hxrow .sc.won12{color:var(--live);font-weight:700;}
  .hxrow .sc.won34{color:var(--gold);font-weight:700;}

  /* Pops are marked on the cell they apply to, in a DIFFERENT visual channel
     from who won the hole:
        hue (green / gold on the number) = who won
        white badge + lifted cell        = shots given on this hole
     Never tint a pop green or gold, or it reads as a side.
     A count, not dots — two shots is common (any pops total over 18) and dots
     were far too small to read on a fairway. */
  /* One shot: a white clipped corner. Two shots: a bigger corner in ice blue —
     deliberately neither green nor gold, so it can never read as a side. */
  .hxrow .sc.pop{ background:rgba(255,255,255,.07); }
  .hxrow .sc.pop::after{
    content:"";
    position:absolute;top:0;left:0;
    width:13px;height:13px;
    background:#FFFFFF;
    clip-path:polygon(0 0, 100% 0, 0 100%);
  }
  /* two shots: same size clip, pink so it jumps. Pink is neither green nor
     gold, so it can never read as a side. */
  .hxrow .sc.pop2{ background:rgba(255,92,160,.13); }
  .hxrow .sc.pop2::after{ background:#FF5CA0; }

  /* Out / In / Total: same size as the score rows, WHITE — green and gold are
     reserved for holes won. White rules top and bottom set them apart. */
  .hxsub{
    background:var(--row-2);
    border-top:2px solid #FFFFFF;
    border-bottom:2px solid #FFFFFF;
  }
  .hxsub .hxc{
    height:46px;
    font-size:23px;font-weight:500;
    font-variant-numeric:tabular-nums;
    color:#FFFFFF;
    background:var(--row-2);
  }
  .hxsub .hnum b{
    font-family:var(--f-cond);
    font-size:17px;font-weight:700;letter-spacing:.06em;color:#FFFFFF;
  }
  /* the segment tally is the exception — it wears the winning side's colour */
  .hxsub .hnum i{font-size:14px;font-weight:700;font-family:var(--f-sans);}
  .hxsub .hnum.t12 i{color:var(--live);}
  .hxsub .hnum.t34 i{color:var(--gold);}
  .hxsub .hnum.tAS i{color:var(--ink-2);}

  .hxtap{cursor:pointer;}
  .hxtap:active .hxc{background:var(--row-2);}
  table.hgrid.big td.hcol{
    padding:3px 2px;line-height:1.05;
    font-family:var(--f-sans);
  }
  table.hgrid.big td.hcol b{
    display:block;font-size:19px;font-weight:700;color:var(--ink-2);
  }
  table.hgrid.big td.hcol i{
    display:block;font-style:normal;
    font-family:var(--f-cond);
    font-size:12px;font-weight:600;letter-spacing:.03em;
    color:#6E6E6E;white-space:nowrap;
  }

  .needstrip{
    padding:11px 16px;background:var(--row);
    border-bottom:1px solid var(--line);
    font-size:15px;color:var(--gold);
  }

  /* ---------- new round sheet ---------- */
  .newbtn{border-style:dashed;}
  .sheetwrap{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;}
  .sheetwrap[hidden]{display:none;}
  .sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.72);}
  .sheet{
    position:relative;width:100%;
    background:var(--row);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    padding:18px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
    max-height:100%;overflow-y:auto;
  }
  .sheettitle{
    font-family:var(--f-cond);
    font-size:22px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    padding:0 4px;
  }
  .sheetsub{font-size:14px;color:var(--ink-3);padding:0 4px 6px;}
  .sheetbtn{
    text-align:left;width:100%;
    display:flex;flex-direction:column;gap:2px;
    padding:13px 15px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--row-2);color:var(--ink);cursor:pointer;
  }
  .sheetbtn strong{
    font-family:var(--f-cond);
    font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--bar);
  }
  .sheetbtn span{font-size:14px;color:var(--ink-3);line-height:1.4;}
  .sheetbtn.danger strong{color:#FF6B5A;}
  .sheetbtn.ccw strong{color:var(--bar);}
  .sheetbtn.demo strong{color:var(--gold);}
  .sheetcancel{
    margin-top:4px;padding:14px;
    border:0;border-radius:10px;background:transparent;
    color:var(--ink-2);
    font-family:var(--f-cond);
    font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    cursor:pointer;
  }

  /* ---------- one hole, one screen ---------- */
  .hole{display:none;}
  .hole.on{display:block;}
  .hehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 12px 0;}
  .henav{
    width: 44px;height:42px;border-radius:9px;
    border:1px solid var(--line);background:var(--row-2);color:var(--ink-2);
    font-size:24px;line-height:1;cursor:pointer;flex-shrink:0;
  }
  .henav:disabled{opacity:.22;cursor:default;}
  .hemid{text-align:center;flex:1;min-width:0;}
  .henum{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .hemeta{
    font-family:var(--f-cond);
    font-size:13px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-3);margin-top:2px;
  }
  .heband{
    margin:6px 12px 0;padding:6px 10px;border-radius:8px;text-align:center;
    font-family:var(--f-cond);
    font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    background:var(--row-2);color:var(--ink-3);
    border:1px solid var(--line-soft);
  }
  .heband.w12{background:#0F2409;color:var(--live);border-color:var(--bar-dim);}
  .heband.w34{background:#2A2612;color:var(--gold);border-color:#6B5A18;}

  .hescores{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px 12px 0;}
  .hecell{
    display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:5px 2px 6px;
    border:1px solid var(--line);border-radius:9px;
    background:var(--row);color:var(--ink);cursor:pointer;
    min-width:0;
  }
  .hecell em{
    font-style:normal;font-family:var(--f-cond);
    font-size:13px;font-weight:600;letter-spacing:.04em;
    color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
  }
  .hecell em b{color:var(--bar);letter-spacing:-1px;}
  .hecell span{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.05;}
  .hecell.empty span{color:#4E4E4E;}
  .hecell.sel{border-color:var(--bar);box-shadow:inset 0 -3px 0 var(--bar);background:var(--row-2);}
  .hecell.won12 span{color:var(--live);}
  .hecell.won34 span{color:var(--gold);}

  .hepadwrap{padding:7px 12px 0;}
  .pad.hepad .key{height:43px;font-size:21px;}
  .pad.hepad{gap:6px;}

  .junkgrid{padding:8px 12px 0;display:flex;flex-direction:column;gap:4px;}
  .junkrow{display:grid;grid-template-columns:70px repeat(4,1fr);gap:4px;align-items:center;}
  .junklbl{
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .junkhdr .junklbl{font-size:13px;text-align:center;color:var(--ink-2);}
  .junkhdr .junklbl:first-child{text-align:left;}
  .junkbtn{
    position:relative;
    height: 32px;border-radius:7px;
    border:1px solid var(--line);background:var(--row);color:#5A5A5A;
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;
    padding:0;
  }
  .junkbtn span{display:block;line-height:30px;}
  .junkbtn em{
    position:absolute;top:1px;right:3px;
    font-style:normal;font-size:10px;font-weight:700;
    color:var(--bar-ink);opacity:.7;
  }
  .junkbtn.on{background:var(--bar);border-color:var(--bar);color:var(--bar-ink);font-weight:700;}
  .junkbtn.on em{color:var(--bar-ink);opacity:.6;}

  .greenies{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px 12px calc(10px + env(safe-area-inset-bottom));}
  .gstep{
    background:var(--row);border:1px solid var(--line-soft);border-radius:9px;
    padding:7px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;
  }
  .gtitle{display:flex;flex-direction:column;gap:0;min-width:0;}
  .gtitle strong{
    font-family:var(--f-cond);font-size:14px;font-weight:700;letter-spacing:.1em;
  }
  .gtitle strong i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--bar);}
  .gstep.s12 .gtitle strong{color:var(--live);}
  .gstep.s34 .gtitle strong{color:var(--gold);}
  .gtitle span{
    font-size:12px;color:var(--ink-3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .gctl{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:4px;}
  .gbtn{
    height: 32px;border-radius:7px;border:1px solid var(--line);
    background:var(--row-2);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;
  }
  .gval.here{color:var(--bar);}
  .gval{
    text-align:center;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;
  }

  /* ---------- random draw ---------- */
  .drawwrap{padding:10px 12px 4px;}
  /* One draw, no redraw — a re-roll button would let whoever holds the phone
     draw again until the result suits them. */
  .drawbtn{
    width:100%;padding:14px;border-radius:9px;cursor:pointer;
    font-family:var(--f-cond);
    font-size:16px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  }
  .drawbtn{border:0;background:var(--bar);color:var(--bar-ink);}
  .drawsub{
    padding:14px 16px 6px;
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-3);
  }
  .drawrow{
    display:grid;grid-template-columns:26px 1fr 64px;align-items:center;
    padding:11px 16px;
    background:var(--row);
    border-top:1px solid var(--line-soft);
    font-variant-numeric:tabular-nums;
  }
  .drawrow .dr{
    font-family:var(--f-cond);
    font-size:15px;font-weight:700;color:var(--ink-3);
  }
  .drawrow .dn{
    font-size:16px;color:var(--ink);min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .drawrow .dnet{text-align:center;font-size:21px;font-weight:700;color:var(--ink);}
  .drawrow.win{background:#0F2409;}
  .tietag{
    font-style:normal;font-family:var(--f-cond);
    font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);margin-left:7px;
  }
  .drawrow.win .dr,.drawrow.win .dn,.drawrow.win .dnet{color:var(--live);font-weight:700;}

  /* Ernie — Kyle's logo, from ernie.ico.
     NO filter. Decoding the pixels settled it: the artwork is a WHITE FILL with
     BLACK outlines on a TRANSPARENT background (4768 of 16384 sampled pixels
     opaque; of those, 3146 near-white and 1193 dark). So it already reads as a
     white Ernie on the dark ground. invert() did nothing useful, and
     brightness(0)+invert painted the fill and the linework the same white —
     the blob. Leave it alone.
     The crop trims the long neck stroke, keeping a stub. */
  .ernie{display:flex;justify-content:center;padding:10px 0 4px;}
  .ernie .head{
    width:58px;height:55px;
    overflow:hidden;
    display:block;
  }
  .ernie img{
    width:58px;height:auto;display:block;
    opacity:.9;
  }

  /* ---------- results ---------- */
  .results{display:none;padding:4px 0 10px;}
  .results.on{display:block;}
  .rsec{
    font-family:var(--f-cond);
    font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);
    padding:16px 16px 8px;
  }
  .missing{
    display:flex;flex-direction:column;gap:0;
    margin:6px 12px 0;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;
  }
  .miss{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 14px;background:var(--row);
    border-bottom:1px solid var(--line-soft);
    font-size:15px;color:var(--ink-2);cursor:pointer;text-align:left;border-left:0;border-right:0;border-top:0;
    width:100%;
  }
  .miss:last-child{border-bottom:0;}
  .miss em{font-style:normal;font-family:var(--f-cond);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}

  .teamrow{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 16px;
    background:var(--row);
    border-top:1px solid var(--line-soft);
  }
  .teamrow.win{background:#0F2409;}
  .tname{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .tname strong{font-size:19px;font-weight:600;letter-spacing:.01em;}
  .teamrow.win .tname strong{color:var(--live);}
  .tname small{font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tscore{
    font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;
    color:var(--ink);flex-shrink:0;
  }
  .teamrow.win .tscore{color:var(--live);}
  .winbadge{
    font-family:var(--f-cond);
    font-size:13px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--bar-ink);background:var(--bar);
    padding:3px 8px;border-radius:4px;display:inline-block;margin-top:2px;
  }
  .skin{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 16px;background:var(--row);border-top:1px solid var(--line-soft);
    font-size:15px;
  }
  .skin .h{font-family:var(--f-cond);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
  .skin .t{font-family:var(--f-cond);font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);}
  .rnote{padding:14px 16px 4px;font-size:15px;color:var(--ink-3);line-height:1.5;}
  .rnote b{color:var(--ink-2);font-weight:600;}

  /* ---------- keypads ---------- */
  .padwrap{padding:9px 12px 10px;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .key{
    font-family:var(--f-sans);
    font-size:27px;font-weight:400;
    font-variant-numeric:tabular-nums;
    height:62px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--row-2);
    color:var(--ink);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .08s ease, transform .08s ease;
  }
  .key:active{background:#2E2E2E;transform:scale(.96);}
  .key.used{
    background:var(--ground);
    color:#5A5A5A;
    border-color:var(--line-soft);
    cursor:default;
  }
  .key.used:active{transform:none;background:var(--ground);}
  .key.util{
    font-family:var(--f-cond);
    font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-2);
  }
  .pad.rank .key{height:44px;font-size:21px;}
  .pad.rank{gap:6px;}

  .padnote{display:none;
    font-family:var(--f-cond);
    font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-3);
    text-align:center;
    padding:10px 16px 18px;
  }

  /* ---------- green tab bar ---------- */
  .tabbar{
    flex-shrink:0;
    background:var(--bar);
    background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.08));
    display:grid;grid-template-columns:repeat(3,1fr);
    padding: 7px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .tab{
    border:0;background:transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:3px 0;
    color:var(--bar-ink);
    opacity:.55;
  }
  .tab[aria-selected="true"]{opacity:1;}
  .tab svg{width:21px;height:21px;display:block;}
  .tab span{
    font-family:var(--f-sans);
    font-size:12px;font-weight:500;letter-spacing:.01em;
  }
  .tab[aria-selected="true"] span{font-weight:700;}

  :focus-visible{outline:2px solid var(--bar);outline-offset:-2px;}

  @media (prefers-reduced-motion:reduce){
    .key,.cell{transition:none;}
    .key:active{transform:none;}
    .cell.landed,.total.pop{animation:none;}
    .grid::after{transition:none;}
  }

  /* ---------- iPhone frame: desktop only ----------
     On a real phone every rule here switches off and the app goes full-bleed. */
  @media (min-width:820px){
    .stage{
      height:auto;min-height:100vh;
      background:#050505;
      display:flex;align-items:center;justify-content:center;
      padding:40px 20px;
    }
    .device{position:relative;
      position:relative;
      width:393px;height:852px;
      border-radius:56px;
      padding:11px;
      background:linear-gradient(155deg,#4A4A4A 0%,#141414 26%,#0A0A0A 60%,#3F3F3F 100%);
      box-shadow:0 0 0 1px #000, 0 44px 90px -22px rgba(0,0,0,.95);
      flex-shrink:0;
    }
    .screen{border-radius:45px;position:relative;}
    .island{
      display:block;
      position:absolute;top:10px;left:50%;transform:translateX(-50%);
      width:120px;height:34px;border-radius:20px;background:#000;z-index:5;
    }
    .statusbar{
      display:flex;align-items:center;justify-content:space-between;
      flex-shrink:0;height:50px;padding:14px 30px 0;
      font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
      color:var(--ink);background:var(--ground);
      position:relative;z-index:4;
    }
    .sb-right{display:flex;align-items:center;gap:7px;}
    .noservice{
      font-family:var(--f-cond);
      font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
      color:var(--gold);
    }
    .batt{width:24px;height:12px;border:1.4px solid var(--ink-2);border-radius:3.5px;position:relative;display:inline-block;}
    .batt::after{content:"";position:absolute;right:-3.6px;top:3.3px;width:2px;height:4.5px;border-radius:0 1px 1px 0;background:var(--ink-2);}
    .batt i{position:absolute;left:1.4px;top:1.4px;bottom:1.4px;width:64%;border-radius:1.5px;background:var(--ink);}
    .homebar{
      display:block;
      position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
      width:138px;height:5px;border-radius:3px;background:var(--bar-ink);
      opacity:.5;z-index:6;
    }
    .tabbar{padding-bottom:20px;}
  }
</style>

</head>
<body>
<div class="stage">
<div class="device">
<div class="screen">

  <div class="island"></div>
  <div class="statusbar">
    <span>4:47</span>
    <span class="sb-right">
      <span class="noservice">No Service</span>
      <span class="batt"><i></i></span>
    </span>
  </div>

  <div class="appbar">
    <div class="brandwrap">
      <div class="brand">Mixed Up</div>
      <div class="brand2">Golf</div>
    </div>
    <!-- top = set once, before the round -->
    <div class="setupbtns">
      <button class="setupbtn" data-setup="course"  aria-selected="true">Course</button>
      <button class="setupbtn" data-setup="players" aria-selected="false">Players</button>
      <button class="setupbtn newbtn" id="newRoundBtn" title="Start a new round">New</button>
    </div>
  </div>

  <div class="subtabs" id="subTabs">
    <button class="subtab" data-sub="pars"  aria-selected="true">Pars</button>
    <button class="subtab" data-sub="ranks" aria-selected="false">Rankings</button>
  </div>

  <div id="errbar"></div>

  <div class="scrollarea">
    <div class="shell">

      <div class="players" id="playersUI"></div>
      <div class="holes" id="holesUI"></div>
      <div class="hole"  id="holeUI"></div>

      <div class="context">
        <div class="ctx-label">
          <div class="ctx-name" id="ctxName">Course pars</div>
          <div class="ctx-sub" id="ctxSub">Same pad as scores</div>
        </div>
        <div class="ctx-nav" id="ctxNav"></div>
        <div class="ninetoggle">
          <button class="ninebtn" data-nine="front" aria-pressed="true">Front 9</button>
          <button class="ninebtn" data-nine="back"  aria-pressed="false">Back 9</button>
        </div>
      </div>

      <div class="savechip"><span class="dot"></span><span id="savetext">Saved on this phone</span></div>

      <div class="card">
        <div class="cardhead">
          <span id="cardTitle">Hole</span>
          <span id="cardCount">0 of 9</span>
        </div>
        <div class="grid">
          <div class="row" id="headRow"></div>
          <div class="row" id="cellRow"></div>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div class="nextwrap" id="nextWrap"></div>
      <div class="results" id="resultsUI"></div>

      <div class="padwrap" id="padWrap"></div>
      <div class="padnote" id="padNote"></div>

    </div>
  </div>

  <div class="tabbar" role="tablist">
    <button class="tab" role="tab" data-tab="holes" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18M9 3v18M15 3v18"/></svg>
      <span>Holes</span>
    </button>
    <button class="tab" role="tab" data-tab="scores" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M4 10h16M9 10v9"/></svg>
      <span>Scores</span>
    </button>
    <button class="tab" role="tab" data-tab="results" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21V10M16 21V4M3 21h18"/></svg>
      <span>Results</span>
    </button>
  </div>

  <div class="homebar"></div>

  <!-- New round. Destructive, so it asks first and says exactly what goes. -->
  <div class="sheetwrap" id="newSheet" hidden>
    <div class="sheetbg" id="sheetBg"></div>
    <div class="sheet">
      <div class="sheettitle">Start a new round</div>
      <div class="sheetsub">Nothing is kept unless you choose to keep it.</div>
      <button class="sheetbtn ccw" data-mode="ccw">
        <strong>Round at CCW</strong>
        <span>The usual. CCW pars and white-tee rankings, players kept.</span>
      </button>
      <button class="sheetbtn" data-mode="same">
        <strong>Same course again</strong>
        <span>Clears scores and junk. Keeps whatever course is loaded.</span>
      </button>
      <button class="sheetbtn" data-mode="newcourse">
        <strong>Away course</strong>
        <span>Blanks the course so you can enter pars and rankings. Players kept.</span>
      </button>
      <button class="sheetbtn danger" data-mode="all">
        <strong>Clear everything</strong>
        <span>Course, players, scores and junk. Back to empty.</span>
      </button>
      <button class="sheetbtn demo" data-mode="demo">
        <strong>Fill a demo round</strong>
        <span>Sample course and eight players, for trying the app out.</span>
      </button>
      <button class="sheetcancel" id="sheetCancel">Cancel</button>
    </div>
  </div>

</div>
</div>
</div>

<script>
(function(){
  "use strict";

  var KEY = "mixedUpGolf.v1";
  var OLD_KEYS = ["fourScoreAway.mock.v2"];
  /* Roster: typed on the Players tab, saved like everything else.
     Seeded with the README's sample team 1 so the mockup has something to score. */
  /* The app starts empty. Nothing carries over from a previous round unless
     you deliberately keep it — see New Round. */
  function defaultRoster(){
    var r=[];
    for(var i=0;i<8;i++) r.push({name:"", hcp:""});
    return r;
  }
  /* A COMPLETE round, so Results and the inside game have something to chew on.
     Team 1 is the real CCW sample from CCW_System_README.md §2.1; team 2 is
     invented but plausible for the same card. */
  function demoRoster(){
    return [
      {name:"Kyle", hcp:"24"},{name:"Blake",hcp:"7"},
      {name:"Cody", hcp:"5"}, {name:"Drew", hcp:"16"},
      {name:"Gary", hcp:"11"},{name:"Pete", hcp:"9"},
      {name:"Rich", hcp:"18"},{name:"Tom",  hcp:"6"}
    ];
  }
  function demoScores(){
    var g=[
      [6,7,4,6,6,5,6,5,6, 6,6,4,5,4,6,5,5,5],  // Kyle   — real CCW card
      [5,5,3,4,4,4,4,4,5, 4,4,4,5,4,4,5,4,5],  // Dan
      [5,4,4,5,5,5,4,4,5, 5,4,4,5,4,4,4,5,3],  // Cody   — birdie on 18
      [7,7,4,5,5,5,5,4,5, 5,6,4,4,4,6,5,5,5],  // Brian
      [5,5,4,5,5,5,4,4,6, 5,4,4,5,4,5,4,5,5],  // Gary
      [5,4,4,5,5,4,5,3,6, 4,5,3,5,4,5,5,4,5],  // Pete
      [6,5,4,6,5,5,6,4,6, 5,6,4,5,4,6,5,5,6],  // Rich
      [4,5,3,4,4,5,4,3,4, 5,4,4,4,3,5,4,5,5]   // Tom    — birdie on 9
    ];
    var s={};
    for(var i=0;i<8;i++){
      s[i+"-front"]=g[i].slice(0,9);
      s[i+"-back"] =g[i].slice(9);
    }
    return s;
  }
  function demoJunk(){
    var j=defaultJunk();
    j[17].b[2]=1;              // Cody's birdie on 18
    j[8].b[7]=1;               // Tom's birdie on 9
    j[3].s[0]=1;               // Kyle out of the sand on 4
    j[10].c[3]=1;              // Drew chips in on 11
    j[6].c[1]=1;               // Blake chips in on 7
    j[2].g12=1; j[7].g12=1;    // greenies, 1&2
    j[13].g34=1;               // greenie, 3&4
    return j;
  }
  function P(i){ return state.roster[i]; }
  function pname(i){ return (state.roster[i].name||"").trim() || ("Player "+(i+1)); }
  function phcp(i){ var h=parseInt(state.roster[i].hcp,10); return isNaN(h)?null:h; }
  function teamOf(i){ return i<4 ? 1 : 2; }
  /* 4 or 8 players. Derived, not configured: if nobody is named on team 2,
     it is a four-player round and team 2 simply never appears. */
  function teamTwoActive(){
    for(var i=4;i<8;i++){ if((state.roster[i].name||"").trim()) return true; }
    return false;
  }
  function activeCount(){ return teamTwoActive() ? 8 : 4; }

  function rosterReady(){
    var n=activeCount();
    for(var i=0;i<n;i++){ if(!(state.roster[i].name||"").trim() || phcp(i)===null) return false; }
    return true;
  }

  function blank(){ return [null,null,null,null,null,null,null,null,null]; }

  /* CCW, white tees — verbatim from ScannerBot_CCW.gs (CC_PARS / CC_SI_WHITE).
     This is the DEFAULT course: most rounds are at CCW, so the app opens ready
     to play there. "New Round > New course" clears it for an away day. */
  function ccwPars(){  return {front:[4,4,3,4,4,4,4,3,5],     back:[4,4,3,4,3,4,4,4,4]}; }
  function ccwRanks(){ return {front:[7,3,15,11,1,13,5,17,9], back:[6,10,18,8,16,2,12,14,4]}; }

  /* Junk is entered BY HAND — Kyle: "No formula will work."
     Per hole: who got a birdie / chippie / sandie, and how many greenies each
     side took. Presses are NOT tracked; Kyle keeps those in his head. */
  function defaultJunk(){
    var a=[];
    for(var i=0;i<18;i++) a.push({b:[0,0,0,0], c:[0,0,0,0], s:[0,0,0,0], g12:0, g34:0});
    return a;
  }

  var justLanded = -1;   /* cell index to animate on this render */
  var wasComplete = false;

  var state = {
    /* A first run opens on Players: CCW is already loaded, so names and
       handicaps are the only thing missing. A saved round overrides this and
       reopens on whatever screen it was left on. */
    step:"players", nine:"front", player:0, armed:null,
    roster:defaultRoster(),
    holeIdx:0, holeSel:0, draw:null,
    junk:defaultJunk(),
    pars:ccwPars(),
    ranks:ccwRanks(),
    scores:{}
  };
  for(var i=0;i<8;i++){ state.scores[i+"-front"]=blank(); state.scores[i+"-back"]=blank(); }

  /* ---- auto-save: the real requirement, working. Close the tab and come back. ---- */
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ /* private mode or blocked storage — the page still works */ }
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      /* carry over a round saved under the old 4Score name */
      for(var k=0;!raw && k<OLD_KEYS.length;k++) raw = localStorage.getItem(OLD_KEYS[k]);
      if(!raw) return;
      var got = JSON.parse(raw);
      if(got && got.pars && got.ranks && got.scores){
        state = got;
        state.armed = null;
        if(!state.roster || state.roster.length!==8) state.roster = defaultRoster();
        if(!state.junk || state.junk.length!==18) state.junk = defaultJunk();
        if(typeof state.holeIdx!=="number") state.holeIdx=0;
        state.holeSel=0;
      }
    }catch(e){ /* unreadable — start clean */ }
  }

  function chunkFor(step, nine){
    if(step==="pars")  return state.pars[nine];
    if(step==="ranks") return state.ranks[nine];
    return state.scores[state.player+"-"+nine];
  }
  function current(){
    if(state.step==="pars")  return state.pars[state.nine];
    if(state.step==="ranks") return state.ranks[state.nine];
    return state.scores[state.player+"-"+state.nine];
  }
  function filled(a){ var n=0,i; for(i=0;i<9;i++){ if(a[i]!==null) n++; } return n; }
  function nextIdx(a){ for(var i=0;i<9;i++){ if(a[i]===null) return i; } return -1; }
  function sum(a){ var t=0,i; for(i=0;i<9;i++){ if(a[i]!==null) t+=a[i]; } return t; }

  function usedRanks(){
    var s={};
    ["front","back"].forEach(function(n){
      state.ranks[n].forEach(function(v){ if(v!==null) s[v]=true; });
    });
    return s;
  }

  /* Bottom tabs = during / after the round. Top buttons = set once, before it. */
  var TAB_OF   = {scores:"scores", holes:"holes", hole:"holes", results:"results"};
  var SETUP_OF = {pars:"course", ranks:"course", players:"players"};

  function render(){
    var tab    = TAB_OF[state.step];
    var setup  = SETUP_OF[state.step];
    var isEntry= (state.step==="pars"||state.step==="ranks"||state.step==="scores");
    var isRank = state.step==="ranks";
    var isCourse=(state.step==="pars"||state.step==="ranks");
    var base   = state.nine==="front" ? 1 : 10;

    document.querySelectorAll(".tab").forEach(function(b){
      b.setAttribute("aria-selected", b.dataset.tab===tab ? "true":"false");
    });
    document.querySelectorAll(".setupbtn").forEach(function(b){
      b.setAttribute("aria-selected", b.dataset.setup===setup ? "true":"false");
    });
    document.querySelectorAll(".subtab").forEach(function(b){
      b.setAttribute("aria-selected", b.dataset.sub===state.step ? "true":"false");
    });
    document.getElementById("subTabs").classList.toggle("on", isCourse);

    /* show only the screen that belongs to this tab */
    document.getElementById("playersUI").classList.toggle("on", state.step==="players");
    document.getElementById("holeUI").classList.toggle("on",    state.step==="hole");
    document.getElementById("holesUI").classList.toggle("on",   state.step==="holes");
    document.getElementById("resultsUI").classList.toggle("on", state.step==="results");
    [".context",".card",".nextwrap",".padwrap",".padnote"].forEach(function(s){
      document.querySelector(s).style.display = isEntry ? "" : "none";
    });
    /* The app saves. It does not need to keep announcing that it saves. */
    document.querySelector(".savechip").style.display = "none";
    document.querySelector(".ninetoggle").style.display = isEntry ? "" : "none";
    /* No screen name in the bar — the tabs already say where you are, and the
       space is better spent on the second half of the name. */

    if(state.step==="players"){ renderPlayers(); return; }
    if(state.step==="hole"){    renderHoleEntry(); return; }
    if(state.step==="holes"){   renderHoles();   return; }
    if(state.step==="results"){ renderResults(); return; }

    var arr = current();
    document.querySelectorAll(".ninebtn").forEach(function(b){
      b.classList.toggle("filled", isEntry && chunkDone(chunkFor(state.step, b.dataset.nine)));
      b.setAttribute("aria-pressed", b.dataset.nine===state.nine ? "true":"false");
    });

    var name=document.getElementById("ctxName"),
        sub =document.getElementById("ctxSub"),
        nav =document.getElementById("ctxNav");
    nav.innerHTML="";
    if(state.step==="scores"){
      
      name.textContent=pname(state.player)+" — "+(state.nine==="front"?"Front 9":"Back 9");
      var f=chunkDone(state.scores[state.player+"-front"]),
          bk=chunkDone(state.scores[state.player+"-back"]);
      sub.textContent="Team "+teamOf(state.player)+" · player "+(state.player+1)
        +" of "+activeCount()+" · "
        +(f&&bk ? "both nines in" : f ? "front 9 in" : bk ? "back 9 in" : "nothing entered yet");
      nav.appendChild(mkNav("‹", state.player===0, function(){ state.player--; state.armed=null; render(); }));
      nav.appendChild(mkNav("›", state.player>=activeCount()-1, function(){ state.player++; state.armed=null; render(); }));
    }else if(state.step==="pars"){
      name.textContent="Course pars — "+(state.nine==="front"?"Front 9":"Back 9");
      sub.textContent="";
    }else{
      name.textContent="Hole rankings — "+(state.nine==="front"?"Front 9":"Back 9");
      sub.textContent="";
    }

    document.getElementById("cardTitle").textContent = isRank ? "Hole · ranking" : "Hole";
    document.getElementById("cardCount").textContent = filled(arr)+" of 9";

    var head=document.getElementById("headRow"); head.innerHTML="";
    for(var h=0;h<9;h++){
      var d=document.createElement("div"); d.className="hnum"; d.textContent=base+h; head.appendChild(d);
    }
    var o=document.createElement("div"); o.className="hnum";
    o.textContent = isRank ? "Set" : "Tot";
    head.appendChild(o);

    var row=document.getElementById("cellRow"); row.innerHTML="";
    var nx=nextIdx(arr);
    for(var c=0;c<9;c++){
      (function(idx){
        var b=document.createElement("button"), v=arr[idx];
        b.className="cell"+(v===null?" empty":"")
                   +(idx===nx&&state.armed===null?" next":"")
                   +(state.armed===idx?" armed":"")
                   +(idx===justLanded?" landed":"");
        b.textContent = v===null ? "·" : v;
        b.onclick=function(){
          if(arr[idx]===null) state.armed=null;
          else state.armed = (state.armed===idx) ? null : idx;
          render();
        };
        row.appendChild(b);
      })(c);
    }
    var done = filled(arr)===9;
    var tot=document.createElement("div");
    tot.className="total"+(done?" done":"")+((done&&!wasComplete)?" pop":"");
    tot.textContent = isRank ? (filled(arr)+"/9") : sum(arr);
    row.appendChild(tot);

    document.querySelector(".grid").classList.toggle("complete", done);
    wasComplete = done;
    justLanded = -1;

    var hint=document.getElementById("hint");
    if(state.armed!==null){
      hint.innerHTML="";
    }else if(isRank){
      hint.innerHTML="";
    }else if(filled(arr)===9){
      hint.innerHTML="Total <b>"+sum(arr)+"</b>";
    }else{
      hint.innerHTML="";
    }

    renderNext(done, arr, isRank);

    renderPad(isRank, arr);
    document.getElementById("padNote").textContent = "";
  }

  /* Where the next tap should take you. The whole session is 20 chunks in a
     known order, so the app walks it — you never hunt for the next one. */
  function nextTarget(){
    if(state.step==="pars")
      return state.nine==="front"
        ? {step:"pars", nine:"back",  label:"Pars · Back 9"}
        : {step:"ranks",nine:"front", label:"Rankings · Front 9"};
    /* Setup ends when the course is in. Where you go next depends on whether
       you are about to play or typing up a finished card — not our call. */
    if(state.step==="ranks")
      return state.nine==="front"
        ? {step:"ranks", nine:"back", label:"Rankings · Back 9"}
        : null;
    if(state.nine==="front")
      return {step:"scores",nine:"back",player:state.player,
              label:pname(state.player)+" · Back 9"};
    if(state.player<activeCount()-1)
      return {step:"scores",nine:"front",player:state.player+1,
              label:pname(state.player+1)+" · Front 9"};
    return null;
  }

  function renderNext(done, arr, isRank){
    var w=document.getElementById("nextWrap");
    w.innerHTML="";
    if(!done) return;

    var t=nextTarget();

    /* Nothing further to walk to — say so quietly, don't shout a green
       call-to-action at a step the app shouldn't be choosing. */
    if(!t){
      var done=document.createElement("div");
      done.className="donechip";
      done.textContent = state.step==="ranks" ? "Course set"
                       : state.step==="pars"  ? "Pars set"
                       : "All scores in";
      w.appendChild(done);
      return;
    }

    var b=document.createElement("button");
    b.className="nextbtn";

    var lead=document.createElement("span");
    lead.textContent = "Next: "+t.label;

    var tot=document.createElement("span");
    tot.className="tot";
    tot.textContent = isRank ? "9 of 9 set" : "Total "+sum(arr);

    b.appendChild(lead); b.appendChild(tot);
    b.onclick=function(){
      state.step=t.step; if(t.nine) state.nine=t.nine;
      if(typeof t.player==="number") state.player=t.player;
      state.armed=null; wasComplete=false;
      save(); render();
      document.querySelector(".scrollarea").scrollTop=0;
    };
    w.appendChild(b);
  }

  /* ---------------------------------------------------------------
     Scoring, ported verbatim from ccw_golf_photo.jsx. The only change
     is that pars and rankings come from what was typed in, instead of
     from the hardcoded CCW constants.
     --------------------------------------------------------------- */
  function full(o){ return o.front.concat(o.back); }
  function playerScores(i){ return state.scores[i+"-front"].concat(state.scores[i+"-back"]); }
  function chunkDone(a){ return filled(a)===9; }

  function strokesFor(hcp, hdcp){
    return Math.floor(hcp/18) + (hdcp <= hcp%18 ? 1 : 0);
  }
  function netOf(i, ranks){
    var sc=playerScores(i);
    return sc.map(function(g,h){ return g - strokesFor(phcp(i), ranks[h]); });
  }
  function twoBestBallNet(idxs, ranks){
    var nets=idxs.map(function(i){ return netOf(i,ranks); }), t=0;
    for(var h=0;h<18;h++){
      var col=nets.map(function(n){ return n[h]; }).sort(function(a,b){ return a-b; });
      t += col[0]+col[1];
    }
    return t;
  }
  function calcSkins(pars){
    var out=[];
    for(var h=0;h<18;h++){
      var par=pars[h], under=[];
      if(par===null) continue;
      for(var i=0;i<activeCount();i++){
        var s=playerScores(i)[h];
        /* an unentered score is ABSENT, never a number. In JS null < 4 is
           true, so a missing score would otherwise count as under par and
           steal the skin — the same trap as the -1 sentinel in the Sheet. */
        if(s!==null && s<par) under.push({name:pname(i), score:s});
      }
      if(!under.length) continue;
      var min=Math.min.apply(null,under.map(function(u){ return u.score; }));
      var w=under.filter(function(u){ return u.score===min; });
      if(w.length!==1) continue;
      var d=par-min;
      out.push({hole:h+1, player:w[0].name, score:min, par:par,
                type:d>=3?"Albatross":d===2?"Eagle":"Birdie"});
    }
    return out;
  }

  /* every chunk in the session, in entry order */
  function allChunks(){
    var list=[
      {a:state.pars.front, label:"Pars · Front 9",     go:{step:"pars", nine:"front"}},
      {a:state.pars.back,  label:"Pars · Back 9",      go:{step:"pars", nine:"back"}},
      {a:state.ranks.front,label:"Rankings · Front 9", go:{step:"ranks",nine:"front"}},
      {a:state.ranks.back, label:"Rankings · Back 9",  go:{step:"ranks",nine:"back"}}
    ];
    for(var i=0;i<activeCount();i++){
      list.push({a:state.scores[i+"-front"], label:pname(i)+" · Front 9",
                 go:{step:"scores",nine:"front",player:i}});
      list.push({a:state.scores[i+"-back"],  label:pname(i)+" · Back 9",
                 go:{step:"scores",nine:"back", player:i}});
    }
    return list;
  }

  function goTo(t){
    state.step=t.step; if(t.nine) state.nine=t.nine;
    if(typeof t.player==="number") state.player=t.player;
    state.armed=null; wasComplete=false;
    save(); render();
    document.querySelector(".scrollarea").scrollTop=0;
  }

  /* Enter walks name -> handicap -> next player's name, and lets go at the end. */
  function advance(seq){
    var next=document.querySelector('#playersUI [data-seq="'+(seq+1)+'"]');
    if(next){ next.focus(); if(next.select) next.select(); }
    else{
      var cur=document.querySelector('#playersUI [data-seq="'+seq+'"]');
      if(cur) cur.blur();
    }
  }

  function renderPlayers(){
    var w=document.getElementById("playersUI");
    w.innerHTML="";

    [1,2].forEach(function(teamNo){
      var h=document.createElement("div");
      h.className="pteam";
      h.textContent = teamNo===1 ? "Team 1 — your foursome"
                    : "Team 2 — leave blank if only four are playing";
      w.appendChild(h);

      var head=document.createElement("div");
      head.className="phead";
      head.innerHTML="<span></span><span>Name</span><span>Course hcp</span>";
      w.appendChild(head);

      for(var k=0;k<4;k++){
        (function(i){
          var r=document.createElement("div"); r.className="prow";

          /* 1-8, not A-D. The app talks in player numbers everywhere else, and
             the inside game is 1&2 against 3&4 — so the slot number IS the
             pairing. A/B/C/D was CCW's per-team lettering and meant nothing here. */
          var slot=document.createElement("div");
          slot.className="pslot";
          slot.textContent=i+1;

          var nm=document.createElement("input");
          nm.className="pin"; nm.type="text";
          nm.placeholder="Name";
          nm.value=state.roster[i].name;
          nm.autocapitalize="words"; nm.autocomplete="off"; nm.spellcheck=false;
          /* iOS labels the return key from this, and Enter walks to the next
             field instead of doing nothing */
          nm.setAttribute("enterkeyhint","next");
          nm.dataset.seq=(i*2);
          nm.oninput=function(){ state.roster[i].name=nm.value; save(); };
          nm.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); advance(i*2); } };

          var hc=document.createElement("input");
          hc.className="pin hcp"; hc.type="text";
          hc.inputMode="numeric"; hc.placeholder="—";
          hc.value=state.roster[i].hcp;
          hc.setAttribute("enterkeyhint", i===7 ? "done" : "next");
          hc.dataset.seq=(i*2+1);
          hc.oninput=function(){
            hc.value=hc.value.replace(/[^0-9]/g,"").slice(0,2);
            state.roster[i].hcp=hc.value; save();
          };
          hc.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); advance(i*2+1); } };

          r.appendChild(slot); r.appendChild(nm); r.appendChild(hc);
          w.appendChild(r);
        })((teamNo-1)*4+k);
      }
    });

    var e=document.createElement("div"); e.className="ernie";
    var crop=document.createElement("span"); crop.className="head";
    var img=document.createElement("img");
    img.src=ERNIE; img.alt="Ernie";
    crop.appendChild(img); e.appendChild(crop);
    w.appendChild(e);
  }

  /* The whole card at once — holes down, players across, same orientation as
     4Score's Holes tab. Read-only: this is for checking your work, not entry.
     No green/yellow hole colouring — that is Part 2, and the rule that decides
     who won a hole is not known yet. Do not guess it here. */
  /* ---------------------------------------------------------------
     THE INSIDE GAME — team 1's foursome only.
     Rules decoded from the 4Score backing Sheet; see
     GOLF_PWA_PART2_RULES.md. Verified against real cell values:

       pops(i)   = courseHcp(i) - min(courseHcp across the foursome)
       net(i,h)  = gross - ( floor(pops/18) + (SI[h] <= pops%18 ? 1 : 0) )
       BB12      = min(net p1, net p2)
       BB34      = min(net p3, net p4)
       lower BB wins the hole; equal is halved

     Team 2 never appears here — their scores are entered after the round.
     --------------------------------------------------------------- */

  function insideGame(){
    var ranks=full(state.ranks);
    var haveRanks = ranks.every(function(v){ return v!==null; });

    var hcps=[], ok=true;
    for(var i=0;i<4;i++){ var h=phcp(i); if(h===null) ok=false; hcps.push(h); }
    if(!ok || !haveRanks) return {ready:false, haveRanks:haveRanks, haveHcps:ok};

    var low=Math.min.apply(null,hcps);
    var pops=hcps.map(function(h){ return h-low; });

    var net=[], gross=[];
    for(var p=0;p<4;p++){
      var sc=playerScores(p), nr=[];
      for(var q=0;q<18;q++){
        nr.push(sc[q]===null ? null : sc[q]-strokesFor(pops[p], ranks[q]));
      }
      gross.push(sc); net.push(nr);
    }

    var pts=[], tally={p12:0,p34:0,halved:0};
    for(var hh=0;hh<18;hh++){
      var a=bestOf(net[0][hh],net[1][hh]), b=bestOf(net[2][hh],net[3][hh]);
      if(a===null||b===null){ pts.push(null); continue; }
      if(a<b){ pts.push("12"); tally.p12++; }
      else if(b<a){ pts.push("34"); tally.p34++; }
      else { pts.push("AS"); tally.halved++; }
    }
    return {ready:true, pops:pops, low:low, net:net, gross:gross, pts:pts, tally:tally, ranks:ranks};

    function bestOf(x,y){
      if(x===null&&y===null) return null;
      if(x===null) return y;
      if(y===null) return x;
      return Math.min(x,y);
    }
  }

  function initials(a,b){
    return (pname(a).trim()[0]||"?").toUpperCase()
         + (pname(b).trim()[0]||"?").toUpperCase();
  }

  /* ---------------------------------------------------------------
     ONE HOLE, ONE SCREEN — no scrolling.
     AppSheet needs ~5 screens per hole. Everything here fits above the fold:
     four scores from the same 3x3 pad (type 6544 and the hole is done),
     junk as one grid, greenies as two steppers.
     --------------------------------------------------------------- */
  function renderHoleEntry(){
    var w=document.getElementById("holeUI");
    w.innerHTML="";
    var h=state.holeIdx, g=insideGame();
    var pars=full(state.pars), ranks=full(state.ranks);
    var J=state.junk[h];

    var head=document.createElement("div"); head.className="hehead";
    var nav1=document.createElement("button");
    nav1.className="henav"; nav1.textContent="‹"; nav1.disabled=(h===0);
    nav1.onclick=function(){ state.holeIdx--; state.holeSel=0; save(); render(); };
    var mid=document.createElement("div"); mid.className="hemid";
    var pt = g.ready ? g.pts[h] : null;
    mid.innerHTML="<div class='henum'>"+(h+1)+"</div><div class='hemeta'>"

  function renderHoles(){
    var w=document.getElementById("holesUI");
    w.innerHTML="";
    var g=insideGame(), pars=full(state.pars);

    /* one thin strip, then straight into the grid */
    if(!g.ready){
      var miss=document.createElement("div"); miss.className="needstrip";
      miss.innerHTML="Add "
        +(!g.haveRanks?"hole rankings":"")
        +((!g.haveRanks&&!g.haveHcps)?" and ":"")
        +(!g.haveHcps?"course handicaps":"")
        +" to score the holes";
      w.appendChild(miss);
    }
    /* No holes-won ticker. Kyle plays 5 ways with automatic presses, so a
       running count of holes won says nothing about who owes what — the
       hole-by-hole colouring is what he actually reads. */

    var ranks=full(state.ranks);

    /* CSS Grid, not a table. Every row is a grid with the SAME column template,
       so columns are aligned and fixed by construction — a cell cannot split,
       stretch or drift the way table cells did. */
    var box=document.createElement("div"); box.className="hx";

    var head=row("hxhead");
    head.appendChild(cell("Hole","hh"));
    /* the (n) is coloured by SIDE — green for 1&2, gold for 3&4 — so the two
       twosomes read at a glance. Separate signal from the neutral pop dots
       inside the cells. */
    for(var i=0;i<4;i++){
      var e=cell("","hh "+(i<2?"s12":"s34"));
      e.innerHTML=pname(i)+(g.ready?' <i>('+g.pops[i]+')</i>':'');
      head.appendChild(e);
    }
    box.appendChild(head);

    for(var h=0;h<18;h++){
      (function(hole){
        var r=row("hxtap");
        var meta=[];
        if(pars[hole]!==null)  meta.push("par "+pars[hole]);
        if(ranks[hole]!==null) meta.push("si "+ranks[hole]);
        var hc=cell("","hnum");
        hc.innerHTML="<b>"+(hole+1)+"</b>"+(meta.length?"<i>"+meta.join(" · ")+"</i>":"");
        r.appendChild(hc);

        var pt = g.ready ? g.pts[hole] : null;
        for(var i=0;i<4;i++){
          var v=playerScores(i)[hole];
          var cls = v===null ? "sc miss" : "sc";
          if(v!==null && pt==="12" && i<2) cls="sc won12";
          if(v!==null && pt==="34" && i>=2) cls="sc won34";
          /* pops are marked ON the cell they apply to, as a count — not dots,
             so two (or more) shots read instantly. Kyle at 21 pops gets two on
             stroke index 1-3, which is common, not an edge case. */
          var shots = (g.ready && ranks[hole]!==null)
                        ? strokesFor(g.pops[i], ranks[hole]) : 0;
          if(shots) cls += " pop"+(shots>1?" pop2":"");
          var c=cell(v===null?"·":v, cls);
          if(shots) c.dataset.pops=shots;
          r.appendChild(c);
        }
        r.onclick=function(){ state.holeIdx=hole; state.holeSel=0; goStep("hole"); };
        box.appendChild(r);
      })(h);
      if(h===8)  subtotal("Out",0,9);
      if(h===17){ subtotal("In",9,18); subtotal("Tot",0,18); }
    }

    w.appendChild(box);

    function subtotal(label, from, to){
      var r=row("hxsub");
      var tally="", side="";
      if(g.ready){
        var a=0,b=0;
        for(var k=from;k<to;k++){ if(g.pts[k]==="12")a++; if(g.pts[k]==="34")b++; }
        tally=a+"–"+b;
        /* the segment tally wears the colour of whoever took it */
        side = a>b ? " t12" : b>a ? " t34" : " tAS";
      }
      var lc=cell("","hnum"+side);
      lc.innerHTML="<b>"+label+"</b>"+(tally?"<i>"+tally+"</i>":"");
      r.appendChild(lc);
      for(var i=0;i<4;i++){
        var sc=playerScores(i), s=0, any=false;
        for(var q=from;q<to;q++){ if(sc[q]!==null){ s+=sc[q]; any=true; } }
        r.appendChild(cell(any?s:"—","sc"));
      }
      box.appendChild(r);
    }
    function row(cls){ var d=document.createElement("div"); d.className="hxrow "+cls; return d; }
    function cell(txt,cls){
      var d=document.createElement("div"); d.className="hxc "+cls;
      if(txt!=="") d.textContent=txt;
      return d;
    }
  }

  /* ---- the random draw --------------------------------------------
     All eight mixed into four pairs, independent of team. Fisher-Yates,
     same as CC_shuffle in ScannerBot_CCW.gs — verified fair over 2M draws
     in ccw_draw_fairness_test.js.

     Drawn ONCE and stored. A draw recomputed on every render would reshuffle
     each time the screen is looked at, which is useless for a bet.

     Uses RAW course handicaps, not the inside game's relative pops. */
  function drawPairs(){
    var a=[0,1,2,3,4,5,6,7];
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    var pairs=[];
    for(var k=0;k<a.length-1;k+=2) pairs.push([a[k],a[k+1]]);
    return pairs;
  }
  function bbGross(p,q){
    var A=playerScores(p), B=playerScores(q), t=0;
    for(var h=0;h<18;h++) t+=Math.min(A[h],B[h]);
    return t;
  }
  function bbNet(p,q,ranks){
    var A=netOf(p,ranks), B=netOf(q,ranks), t=0;
    for(var h=0;h<18;h++) t+=Math.min(A[h],B[h]);
    return t;
  }

  function renderDraw(w, ranks){
    var sec=document.createElement("div");
    sec.className="rsec"; sec.textContent="Random draw";
    w.appendChild(sec);

    if(!state.draw){
      var b=document.createElement("button");
      b.className="drawbtn"; b.textContent="Draw the pairs";
      b.onclick=function(){ state.draw=drawPairs(); save(); render(); };
      var wrap=document.createElement("div"); wrap.className="drawwrap";
      wrap.appendChild(b); w.appendChild(wrap);
      return;
    }

    /* Two separate ranked lists, same as ccw_golf_photo.jsx: the same four
       pairs sorted by gross, then by net, each with the winner at #1. */
    var names=state.draw.map(function(pr){ return pname(pr[0])+" & "+pname(pr[1]); });
    var gp=state.draw.map(function(pr,i){
      return {names:names[i], score:bbGross(pr[0],pr[1])};
    }).sort(function(a,b){ return a.score-b.score; });
    var np=state.draw.map(function(pr,i){
      return {names:names[i], score:bbNet(pr[0],pr[1],ranks)};
    }).sort(function(a,b){ return a.score-b.score; });

    list("Best ball gross", gp);
    list("Best ball net",   np);

    function list(title, rows){
      var h=document.createElement("div");
      h.className="drawsub"; h.textContent=title;
      w.appendChild(h);

      /* Ties are NOT resolved — every pair on the low score is marked, and the
         heading says it is tied. Highlighting only the first would silently
         crown whichever pair the sort happened to put on top. */
      /* The low score keeps its green. On a tie EVERY pair on that score is
         green and tagged TIED — highlighting only the first would silently
         crown whichever pair the sort happened to put on top. */
      var best=rows[0].score;
      var nBest=rows.filter(function(r){ return r.score===best; }).length;
      var tied=nBest>1;

      /* rank numbers share a place on a tie: 1,1,3,4 not 1,2,3,4 */
      var rank=0, prev=null;
      rows.forEach(function(r,i){
        if(r.score!==prev){ rank=i+1; prev=r.score; }
        var isBest=r.score===best;
        var d=document.createElement("div");
        d.className="drawrow"+(isBest?" win":"");
        d.innerHTML='<span class="dr">'+rank+'</span>'
                   +'<span class="dn">'+r.names
                   +(isBest&&tied?' <em class="tietag">tied</em>':'')+'</span>'
                   +'<span class="dnet">'+r.score+'</span>';
        w.appendChild(d);
      });
    }
  }

  /* ---- new round ---------------------------------------------------
     Day 2 of a trip is often the SAME course, so re-typing 36 numbers you
     already entered would be daft. The sheet asks what to keep. ------- */
  function blankScores(){
    var s={};
    for(var i=0;i<activeCount();i++){ s[i+"-front"]=blank(); s[i+"-back"]=blank(); }
    return s;
  }
  function newRound(mode){
    if(mode!=="same"){ /* course goes unless you said same course */
      if(mode==="newcourse"||mode==="all"){
        state.pars ={front:blank(),back:blank()};
        state.ranks={front:blank(),back:blank()};
      }
    }
    if(mode==="all") state.roster=defaultRoster();

    if(mode==="ccw"||mode==="demo"){
      state.pars =ccwPars();
      state.ranks=ccwRanks();
    }
    if(mode==="ccw")  state.roster=defaultRoster();
    state.scores=blankScores();
    state.junk=defaultJunk();

    /* DEMO — a permanent feature, kept deliberately: it is the only way to see
       Results and the inside game without typing eight scorecards, and it is
       how the app gets shown to people. Team 1's card is the real CCW sample
       from CCW_System_README.md, so the numbers on screen are honest. */
    if(mode==="demo"){
      state.roster=demoRoster();
      state.scores=demoScores();
      state.junk  =demoJunk();
    }
    state.holeIdx=0; state.holeSel=0; state.armed=null; state.draw=null;
    state.nine="front"; wasComplete=false;
    /* Every new round lands on Players. The roster sets the low man, the low
       man sets everyone's pops, and pops decide every hole result — so a wrong
       roster scores the whole round wrong, silently. It also genuinely changes
       every round, since the foursomes get re-thrown.
       The demo is the exception: it is already complete, so it opens on Holes. */
    state.step = (mode==="demo") ? "holes" : "players";
    state.lastCourse="pars";
    save(); render();
    document.querySelector(".scrollarea").scrollTop=0;
  }

  var sheet=document.getElementById("newSheet");
  function closeSheet(){ sheet.hidden=true; }
  document.getElementById("newRoundBtn").onclick=function(){ sheet.hidden=false; };
  document.getElementById("sheetCancel").onclick=closeSheet;
  document.getElementById("sheetBg").onclick=closeSheet;
  sheet.querySelectorAll(".sheetbtn").forEach(function(b){
    b.onclick=function(){ closeSheet(); newRound(b.dataset.mode); };
  });

  function goStep(step){
    state.step=step; state.armed=null; wasComplete=false;
    save(); render();
    document.querySelector(".scrollarea").scrollTop=0;
  }
  document.querySelectorAll(".subtab").forEach(function(b){
    b.onclick=function(){
      state.step=b.dataset.sub; state.lastCourse=state.step;
      state.armed=null; wasComplete=false;
      save(); render();
    };
  });
  document.querySelectorAll(".ninebtn").forEach(function(b){
    b.onclick=function(){ state.nine=b.dataset.nine; state.armed=null; render(); };
  });

  /* Surface any runtime error on screen instead of dying silently. A blank or
     frozen screen tells us nothing; the message tells us everything. */
  var _render = render;
  render = function(){
    try { _render(); }
    catch(e){
      var bar=document.getElementById("errbar");
      if(bar){
        bar.style.display="block";
        bar.textContent="Error in "+state.step+": "+(e && e.message ? e.message : e);
      }
      throw e;
    }
  };
  if(typeof window!=="undefined"){
    window.onerror=function(msg){
      var bar=document.getElementById("errbar");
      if(bar){ bar.style.display="block"; bar.textContent=String(msg); }
    };
  }

  /* A saved round from an older build may name a screen that no longer
     exists (the Pops tab, for one). Fall back rather than render nothing. */
  var KNOWN={pars:1,ranks:1,players:1,scores:1,holes:1,hole:1,results:1};
  if(!KNOWN[state.step]) state.step="holes";

  load();
  if(!KNOWN[state.step]) state.step="holes";
  render();
})();
</script>

<script>
/* Register the service worker — this is what makes the app open with no signal.
   Failure is non-fatal: without it the app still works, it just needs a
   connection to start. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.log('service worker did not register:', e);
    });
  });
}
</script>
</body>
